---
# Auto-assign configuration for kentaro-m/auto-assign-action v2, run via
# velero-io/velero's reusable auto_assign_prs workflow. Assigns the PR to
# its author and requests review from two individual maintainers — the
# same behavior the removed necojackarc/auto-request-review job provided.
# Note the schema: kentaro-m ignores the old `reviewers.defaults`/`groups`/
# `options.*` keys that necojackarc used.
addAssignees: author
addReviewers: true
numberOfReviewers: 2
useReviewGroups: true
reviewGroups:
  maintainers:
    - sseago
    - ywk253100
    - shubham-pampattiwar
    - kaovilai
    - anshulahuja98
skipKeywords:
  - WIP
  - wip
  - DO NOT MERGE
